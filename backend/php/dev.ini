; PHP settings for the local API server (npm run dev:api), loaded through
; PHP_INI_SCAN_DIR in addition to the system php.ini, which is not changed.
;
; The back office uploads car photos of up to 5 MB each (several per request);
; PHP's defaults (2 MB per file, 8 MB per request) would reject them before Laravel.
; In production, set the same limits in the PHP-FPM pool and the web server.
upload_max_filesize = 6M
post_max_size = 64M
max_file_uploads = 20
